<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edugroit</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #0b1020;
        color: #fff;
      }
      .card {
        padding: 24px 28px;
        border-radius: 18px;
        background: linear-gradient(135deg, #1d4ed8, #9333ea);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
        text-align: center;
      }
      p {
        margin: 0;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p>Loading Edugroit...</p>
    </div>
  </body>
</html>
